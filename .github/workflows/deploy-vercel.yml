name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel configuration
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Add $name in repository Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build tools
        run: python -m pip install --disable-pip-version-check uv
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production project
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          printf 'Deployment: %s\n' "$deployment_url"
          printf '### Vercel production deployment\n\n%s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
