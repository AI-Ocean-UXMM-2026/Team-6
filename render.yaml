services:
  - type: web
    name: fom-team-6
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: python -m compileall -q server.py providers.py receipt_mvp.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HANDSHAKE_HOST
        value: 0.0.0.0
      - key: HANDSHAKE_STAFF_PASSWORD
        generateValue: true
      - key: HANDSHAKE_CALLBACK_SECRET
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
